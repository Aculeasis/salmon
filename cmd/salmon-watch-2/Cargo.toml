[package]
name = "salmon-watch-2"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
anyhow = "1"
ctrlc = "3"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png"] }
notify-rust = "4.18.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.17.1", features = ["unstable-winit-030"] }
tempfile = "3"

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
# Optimize distributed binaries for size. Release builds do not need Rust's
# symbol table, and one codegen unit gives LLVM the best opportunity to remove
# duplicate and unreachable code across dependencies.
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
