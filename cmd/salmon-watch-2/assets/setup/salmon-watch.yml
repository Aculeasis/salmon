wsClient:
  servers:
    - id: local # Arbitrary but unique ID for this server.
      addr: localhost:41990

    # SSH tunnel example. Salmon Watch starts and supervises ssh, then connects
    # only after ssh prints its readiness marker.
    # - id: remote
    #   addr: 127.0.0.1:41992
    #   tunnel:
    #     ssh:
    #       host: salmon.example.com
    #       user: salmon
    #       port: 22
    #       remoteSalmonAddr: 127.0.0.1:41990
    #       extraSshArgs: ["-i", "/etc/salmon-watch/remote.key"]

    # You can use a custom tunnel command instead of the SSH configuration
    # above. The first item is the executable; the remaining items are passed
    # directly as arguments, without a shell.
    # - id: custom-tunnel
    #   addr: 127.0.0.1:41993
    #   tunnel:
    #     customCommand:
    #       command: ["my-tunnel", "--listen", "127.0.0.1:41993"]
    #       # Omit readinessProbe if the command is ready immediately after it
    #       # starts. Otherwise, WebSocket connections wait until this text
    #       # appears in either stdout or stderr.
    #       readinessProbe:
    #         containsOutput: "tunnel ready"

    # TLS and bearer-token example. Run `salmon-watch generate-bearer-token
    # secure` to create the token and print the corresponding server config.
    # - id: secure
    #   addr: salmon.example.com:41990
    #   tls:
    #     caFile: /etc/salmon-watch/salmon-ca.pem
    #     serverName: salmon.example.com
    #   auth:
    #     bearerTokenFile: /etc/salmon-watch/secure.token
